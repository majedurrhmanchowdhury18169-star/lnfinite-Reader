name: Build Infinite Reader APK (Offline & Ad-Free)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare www & Bundle Offline Vendor Libraries
        run: |
          mkdir -p www/vendor
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then cp index.html www/index.html; fi
          if [ -f "icon.png" ] && [ ! -f "www/icon.png" ]; then cp icon.png www/icon.png; fi
          curl -fsSL https://cdn.tailwindcss.com -o www/vendor/tailwind.js
          curl -fsSL https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js -o www/vendor/lucide.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js -o www/vendor/pdf.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js -o www/vendor/pdf.worker.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/vendor/jspdf.umd.min.js

      - name: Install Capacitor Dependencies
        run: npm install

      - name: Generate Android Project & Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply App Icon & Camera Permissions
        run: |
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$dir"
            cp www/icon.png "$dir/ic_launcher.png"
            cp www/icon.png "$dir/ic_launcher_round.png"
          done
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application|' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Infinite Reader APK
        uses: actions/upload-artifact@v4
        with:
          name: Infinite-Reader-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
